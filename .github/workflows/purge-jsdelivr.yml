name: Purge jsDelivr cache

# After every push to main, ask jsDelivr to drop its cached copy of the
# CSS files that changed, so the websites get the new version right away.

on:
  push:
    branches: [main]
  workflow_dispatch:        # "Run workflow" button: purges every CSS file

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out which files to purge
        id: files
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "push" ] || [ -z "$BEFORE" ] \
             || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "Purging every CSS file"
            git ls-files '*.css' > files.txt
          else
            git diff --name-only --diff-filter=AMR "$BEFORE" "$AFTER" -- '*.css' > files.txt
          fi
          cat files.txt
          echo "count=$(wc -l < files.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      # jsDelivr only allows one purge per file about every hour. When a file
      # is throttled, wait until the limit resets and purge it again.
      - name: Purge
        if: steps.files.outputs.count != '0'
        timeout-minutes: 75
        env:
          REPO: ${{ github.repository }}
        run: |
          purge() {   # prints: ok | throttled <seconds> | error
            curl -fsS "https://purge.jsdelivr.net/gh/${REPO}@main/$1" | jq -r '
              if .status != "finished" then "error"
              elif ([.paths[] | select(.throttled)] | length) > 0
                then "throttled \([.paths[].throttlingReset // 0] | max)"
              else "ok" end' 2>/dev/null || echo error
          }
          retry=()
          while IFS= read -r f; do
            r=$(purge "$f")
            case "$r" in
              ok) echo "purged     $f" ;;
              throttled*) echo "throttled  $f (resets in ${r#throttled }s)"; retry+=("$f ${r#throttled }") ;;
              *) sleep 10; r=$(purge "$f"); [ "$r" = ok ] && echo "purged     $f" || { echo "::warning::could not purge $f"; retry+=("$f 60"); } ;;
            esac
          done < files.txt

          [ ${#retry[@]} -eq 0 ] && exit 0
          wait=$(printf '%s\n' "${retry[@]}" | awk '{print $2}' | sort -n | tail -1)
          wait=$(( wait + 30 )); [ $wait -gt 4200 ] && wait=4200
          echo "Waiting ${wait}s for jsDelivr's purge limit to reset..."
          sleep "$wait"
          failed=0
          for item in "${retry[@]}"; do
            f=${item% *}
            if [ "$(purge "$f")" = ok ]; then echo "purged     $f"; else echo "::warning::still could not purge $f"; failed=1; fi
          done
          exit $failed
