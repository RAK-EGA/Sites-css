name: Purge jsDelivr cache

# After every push to main, make jsDelivr serve the new version of the CSS
# files that changed.
#
# Two jsDelivr limits shape this workflow:
#  1. Right after a push, jsDelivr can still see the previous commit. A purge
#     at that moment re-caches the OLD file. So we wait first, and afterwards
#     check that the live file really matches this commit.
#  2. Each file can only be purged about once an hour ("throttled"). If a
#     purge is throttled or did not take, we wait for the limit to reset and
#     purge again.
#
# A run can therefore take up to ~70 minutes. That is normal: please don't
# cancel it. Runs are queued, never cancelled, so every push gets purged.

on:
  push:
    branches: [main]
  workflow_dispatch:        # "Run workflow" button: purges every CSS file

permissions:
  contents: read

concurrency:
  group: purge-jsdelivr
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out which files to purge
        id: files
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "push" ] || [ -z "$BEFORE" ] \
             || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "Purging every CSS file"
            git ls-files '*.css' > files.txt
          else
            git diff --name-only --diff-filter=AMR "$BEFORE" "$AFTER" -- '*.css' > files.txt
          fi
          cat files.txt
          echo "count=$(wc -l < files.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Purge and verify
        if: steps.files.outputs.count != '0'
        env:
          REPO: ${{ github.repository }}
        run: |
          CDN="https://cdn.jsdelivr.net/gh/${REPO}@main"
          PURGE="https://purge.jsdelivr.net/gh/${REPO}@main"

          purge() {   # prints: ok | throttled <seconds> | error
            curl -fsS "$PURGE/$1" | jq -r '
              if .status != "finished" then "error"
              elif ([.paths[] | select(.throttled)] | length) > 0
                then "throttled \([.paths[].throttlingReset // 0] | max)"
              else "ok" end' 2>/dev/null || echo error
          }
          is_live() {  # live file equals the newest version on main
            want=$(git show "origin/main:$1" | sha1sum)
            for i in 1 2 3 4 5 6; do
              [ "$(curl -fsS "$CDN/$1" | sha1sum)" = "$want" ] && return 0
              sleep 10
            done
            return 1
          }
          reset_in() {  # seconds until this file can be purged again
            r=$(purge "$1"); case "$r" in throttled*) echo "${r#throttled }" ;; *) echo 0 ;; esac
          }

          echo "Waiting 2 minutes so jsDelivr sees the new commit..."
          sleep 120
          git fetch -q origin main

          pending=()
          while IFS= read -r f; do
            r=$(purge "$f")
            if [ "$r" = ok ] && is_live "$f"; then
              echo "live       $f"
            else
              echo "not yet    $f ($r)"
              pending+=("$f")
            fi
          done < files.txt
          [ ${#pending[@]} -eq 0 ] && exit 0

          wait=0
          for f in "${pending[@]}"; do s=$(reset_in "$f"); [ "$s" -gt "$wait" ] && wait=$s; done
          wait=$(( wait + 30 )); [ $wait -gt 4200 ] && wait=4200
          echo "Waiting ${wait}s for jsDelivr's purge limit to reset..."
          sleep "$wait"
          git fetch -q origin main

          failed=0
          for f in "${pending[@]}"; do
            if [ "$(purge "$f")" = ok ] && is_live "$f"; then
              echo "live       $f"
            else
              echo "::warning::$f is still not live; run this workflow again in an hour"
              failed=1
            fi
          done
          exit $failed
